<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Dice Roller</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            text-align: center;
            background: #fafafa;
        }
        
        h1 { font-size: 1.5rem; color: var(--text-main); }

        /* --- Dice Selector Grid --- */
        .dice-grid {
            padding: 1.5rem;
            display: grid;
            gap: 1rem;
        }

        .die-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .die-name {
            font-weight: 700;
            width: 50px;
            color: var(--primary);
        }

        .counter-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            background: #f9fafb;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-main);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover { background: #e5e7eb; }
        .qty-btn:active { transform: scale(0.95); }

        .qty-display {
            font-weight: 600;
            width: 24px;
            text-align: center;
        }

        /* --- Action Area --- */
        .actions {
            padding: 0 1.5rem 1.5rem;
            display: flex;
            gap: 1rem;
        }

        .btn-main {
            flex: 1;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-main:hover { background: var(--primary-hover); }
        
        .btn-reset {
            background: white;
            color: var(--text-muted);
            border: 1px solid var(--border);
            width: auto;
            padding: 0 1rem;
        }
        .btn-reset:hover { background: #f9fafb; color: var(--text-main); }

        /* --- Results Area --- */
        .result-area {
            background: #111827;
            color: white;
            padding: 1.5rem;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result-total {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .result-details {
            font-size: 0.9rem;
            color: #9ca3af;
            line-height: 1.4;
        }

        /* --- History --- */
        .history-section {
            border-top: 1px solid var(--border);
            flex: 1;
            overflow-y: auto;
            max-height: 300px;
            background: #fafafa;
        }

        .history-header {
            padding: 0.75rem 1.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #f3f4f6;
            position: sticky;
            top: 0;
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .h-time { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
        .h-summary { font-weight: 500; font-size: 0.9rem; }
        .h-total { font-weight: 700; font-size: 1.25rem; color: var(--primary); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Dice Roller</h1>
    </header>

    <div class="result-area" id="resultArea">
        <div class="result-total" id="displayTotal">-</div>
        <div class="result-details" id="displayDetails">Select dice below</div>
    </div>

    <div class="dice-grid" id="diceGrid">
        </div>

    <div class="actions">
        <button class="btn-main btn-reset" onclick="resetCounts()">Clear</button>
        <button class="btn-main" onclick="rollAll()">Roll Dice</button>
    </div>

    <div class="history-section">
        <div class="history-header">History</div>
        <ul class="history-list" id="historyList">
            </ul>
    </div>
</div>

<script>
    // Configuration
    const diceTypes = [
        { id: 'd4', label: 'd4', sides: 4 },
        { id: 'd6', label: 'd6', sides: 6 },
        { id: 'd10', label: 'd10', sides: 10 },
        { id: 'd20', label: 'd20', sides: 20 },
        { id: 'd100', label: 'd100', sides: 100, step: 10 } // Special step logic
    ];

    // State
    let counts = { d4: 0, d6: 0, d10: 0, d20: 0, d100: 0 };
    const history = [];

    // DOM Elements
    const grid = document.getElementById('diceGrid');
    const displayTotal = document.getElementById('displayTotal');
    const displayDetails = document.getElementById('displayDetails');
    const resultArea = document.getElementById('resultArea');
    const historyList = document.getElementById('historyList');

    // Initialize UI
    function init() {
        grid.innerHTML = diceTypes.map(die => `
            <div class="die-row">
                <span class="die-name">${die.label}</span>
                <div class="counter-controls">
                    <button class="qty-btn" onclick="updateCount('${die.id}', -1)">-</button>
                    <span class="qty-display" id="qty-${die.id}">0</span>
                    <button class="qty-btn" onclick="updateCount('${die.id}', 1)">+</button>
                </div>
            </div>
        `).join('');
    }

    // Logic: Update Counts
    function updateCount(id, change) {
        counts[id] = Math.max(0, counts[id] + change);
        document.getElementById(`qty-${id}`).textContent = counts[id];
    }

    // Logic: Reset
    function resetCounts() {
        Object.keys(counts).forEach(key => counts[key] = 0);
        diceTypes.forEach(die => {
            document.getElementById(`qty-${die.id}`).textContent = '0';
        });
        displayTotal.textContent = '-';
        displayDetails.textContent = 'Select dice below';
    }

    // Logic: Roll
    function rollAll() {
        // Check if any dice are selected
        const totalDice = Object.values(counts).reduce((a, b) => a + b, 0);
        if (totalDice === 0) {
            displayDetails.textContent = "Please add at least one die.";
            return;
        }

        // Animation
        resultArea.classList.remove('shake');
        void resultArea.offsetWidth; // Trigger reflow
        resultArea.classList.add('shake');
        displayTotal.textContent = '...';

        setTimeout(() => {
            performRoll();
        }, 300);
    }

    function performRoll() {
        let grandTotal = 0;
        let details = [];
        let summaryParts = [];

        diceTypes.forEach(die => {
            const count = counts[die.id];
            if (count > 0) {
                let rolls = [];
                for (let i = 0; i < count; i++) {
                    let val;
                    if (die.id === 'd100') {
                        // d100 logic: multiples of 10 or 0 (0, 10, 20... 90)
                        val = Math.floor(Math.random() * 10) * 10;
                    } else {
                        val = Math.floor(Math.random() * die.sides) + 1;
                    }
                    rolls.push(val);
                    grandTotal += val;
                }
                details.push(`${count}${die.label}: [${rolls.join(', ')}]`);
                summaryParts.push(`${count}${die.label}`);
            }
        });

        // Update Display
        displayTotal.textContent = grandTotal;
        displayDetails.innerHTML = details.join('<br>');

        // Add to History
        addToHistory(grandTotal, summaryParts.join(', '), details.join(' | '));
    }

    function addToHistory(total, summary, fullDetails) {
        const li = document.createElement('li');
        li.className = 'history-item';
        
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        li.innerHTML = `
            <div>
                <span class="h-time">${time}</span>
                <span class="h-summary">${summary}</span>
            </div>
            <div class="h-total">${total}</div>
        `;
        
        // Insert at the top
        historyList.insertBefore(li, historyList.firstChild);
    }

    // Run Init
    init();

</script>

</body>
</html>
