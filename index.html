<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller - Crit & Fail Edition</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        
        body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; padding: 2rem 1rem; min-height: 100vh; }

        .app-container {
            width: 100%; max-width: 500px; background: var(--surface); border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        header { padding: 1.5rem; border-bottom: 1px solid var(--border); text-align: center; background: #fafafa; }
        h1 { font-size: 1.5rem; }

        .dice-grid { padding: 1.5rem; display: grid; gap: 1rem; }
        .die-row {
            display: flex; align-items: center; justify-content: space-between;
            background: #fff; padding: 0.5rem; border: 1px solid var(--border); border-radius: 8px;
        }
        .die-name { font-weight: 700; width: 50px; color: var(--primary); }
        .counter-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn {
            width: 32px; height: 32px; border: 1px solid var(--border); background: #f9fafb;
            border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        .qty-display { font-weight: 600; width: 24px; text-align: center; }

        .actions { padding: 0 1.5rem 1.5rem; display: flex; gap: 1rem; }
        .btn-main {
            flex: 1; padding: 12px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
        }
        .btn-reset { background: white; color: var(--text-muted); border: 1px solid var(--border); padding: 0 1rem; }

        .result-area {
            background: #111827; color: white; padding: 1.5rem; text-align: center;
            min-height: 120px; display: flex; flex-direction: column; justify-content: center;
        }
        .result-total { font-size: 3rem; font-weight: 800; }
        .result-details { font-size: 0.9rem; color: #9ca3af; margin-top: 5px; }

        .history-section { border-top: 1px solid var(--border); flex: 1; overflow-y: auto; max-height: 250px; background: #fafafa; }
        .history-header { padding: 0.75rem 1.5rem; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); background: #f3f4f6; position: sticky; top: 0; }
        .history-item { padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .h-time { font-size: 0.7rem; color: var(--text-muted); display: block; }
        .h-total { font-weight: 700; color: var(--primary); }

        /* --- POPUP STYLES --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(8px); cursor: pointer;
        }
        .overlay.show { display: flex; animation: popIn 0.3s ease-out; }
        .content { text-align: center; }
        .crit-img { max-width: 90%; max-height: 60vh; border-radius: 15px; border: 5px solid white; }
        
        /* Specific colors for success/fail */
        .success-border { border-color: #ffd700; box-shadow: 0 0 30px #ffd700; }
        .fail-border { border-color: #ff4757; box-shadow: 0 0 30px #ff4757; }
        
        .pop-text { font-size: 2.5rem; font-weight: 900; margin-top: 1rem; text-transform: uppercase; font-family: Impact, sans-serif; letter-spacing: 2px; }
        .success-text { color: #ffd700; }
        .fail-text { color: #ff4757; }

        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .shake { animation: shake 0.4s both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            30%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>

<div class="overlay" id="successOverlay" onclick="this.classList.remove('show')">
    <div class="content">
        <img src="https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyZGhiOXQ2cGgyODh0c2YyMDM4ZnJzY3BiMjd6NzA3OWh6ZnYzbTJoMCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/IGUkioSCTYOihYEtVX/giphy.gif" class="crit-img success-border">
        <div class="pop-text success-text">NATURAL 20!</div>
    </div>
</div>

<div class="overlay" id="failOverlay" onclick="this.classList.remove('show')">
    <div class="content">
        <img src="https://media0.giphy.com/media/v1.Y2lkPTZjMDliOTUyMGp6YXRhaXNvcmxlcGo4bTdwMDlobmQzZHdqYmlyNzFyYzFycDFxcSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l2IgDbiP5bhdDLKHhu/giphy.gif" class="crit-img fail-border">
        <div class="pop-text fail-text">CRITICAL FAIL!</div>
    </div>
</div>

<div class="app-container">
    <header><h1>Dice Roller</h1></header>
    <div class="result-area" id="resultArea">
        <div class="result-total" id="displayTotal">-</div>
        <div class="result-details" id="displayDetails">Select dice below</div>
    </div>
    <div class="dice-grid" id="diceGrid"></div>
    <div class="actions">
        <button class="btn-main btn-reset" onclick="resetCounts()">Clear</button>
        <button class="btn-main" onclick="rollAll()">Roll Dice</button>
    </div>
    <div class="history-section">
        <div class="history-header">History</div>
        <ul class="history-list" id="historyList"></ul>
    </div>
</div>

<script>
    const diceTypes = [
        { id: 'd4', label: 'd4', sides: 4 },
        { id: 'd6', label: 'd6', sides: 6 },
        { id: 'd10', label: 'd10', sides: 10 },
        { id: 'd20', label: 'd20', sides: 20 },
        { id: 'd100', label: 'd100', sides: 100 }
    ];

    let counts = { d4: 0, d6: 0, d10: 0, d20: 0, d100: 0 };
    const grid = document.getElementById('diceGrid');
    const displayTotal = document.getElementById('displayTotal');
    const displayDetails = document.getElementById('displayDetails');
    const resultArea = document.getElementById('resultArea');
    const historyList = document.getElementById('historyList');

    grid.innerHTML = diceTypes.map(die => `
        <div class="die-row">
            <span class="die-name">${die.label}</span>
            <div class="counter-controls">
                <button class="qty-btn" onclick="updateCount('${die.id}', -1)">-</button>
                <span class="qty-display" id="qty-${die.id}">0</span>
                <button class="qty-btn" onclick="updateCount('${die.id}', 1)">+</button>
            </div>
        </div>
    `).join('');

    function updateCount(id, change) {
        counts[id] = Math.max(0, counts[id] + change);
        document.getElementById(`qty-${id}`).textContent = counts[id];
    }

    function resetCounts() {
        Object.keys(counts).forEach(key => counts[key] = 0);
        diceTypes.forEach(die => document.getElementById(`qty-${die.id}`).textContent = '0');
        displayTotal.textContent = '-';
        displayDetails.textContent = 'Select dice below';
    }

    function rollAll() {
        const totalDice = Object.values(counts).reduce((a, b) => a + b, 0);
        if (totalDice === 0) return;

        resultArea.classList.remove('shake');
        void resultArea.offsetWidth;
        resultArea.classList.add('shake');
        displayTotal.textContent = '...';

        setTimeout(performRoll, 300);
    }

    function performRoll() {
        let grandTotal = 0;
        let details = [];
        let summaryParts = [];
        let hasNat20 = false;
        let hasNat1 = false;

        diceTypes.forEach(die => {
            const count = counts[die.id];
            if (count > 0) {
                let rolls = [];
                for (let i = 0; i < count; i++) {
                    let val;
                    if (die.id === 'd100') {
                        val = Math.floor(Math.random() * 10) * 10;
                    } else {
                        val = Math.floor(Math.random() * die.sides) + 1;
                    }

                    // Check for Nat 1 or Nat 20 on d20s
                    if (die.id === 'd20') {
                        if (val === 20) hasNat20 = true;
                        if (val === 1) hasNat1 = true;
                    }

                    rolls.push(val);
                    grandTotal += val;
                }
                details.push(`${count}${die.label}: [${rolls.join(', ')}]`);
                summaryParts.push(`${count}${die.label}`);
            }
        });

        displayTotal.textContent = grandTotal;
        displayDetails.innerHTML = details.join('<br>');
        addToHistory(grandTotal, summaryParts.join(', '));

        // Trigger Popups (Success takes priority if both happen)
        if (hasNat20) {
            showPopup('successOverlay');
        } else if (hasNat1) {
            showPopup('failOverlay');
        }
    }

    function showPopup(id) {
        const el = document.getElementById(id);
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 3500);
    }

    function addToHistory(total, summary) {
        const li = document.createElement('li');
        li.className = 'history-item';
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        li.innerHTML = `<div><span class="h-time">${time}</span><span>${summary}</span></div><div class="h-total">${total}</div>`;
        historyList.insertBefore(li, historyList.firstChild);
    }
</script>
</body>
</html>
